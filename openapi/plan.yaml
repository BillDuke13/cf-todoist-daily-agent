openapi: 3.1.0
info:
  title: Todoist Daily Agent API
  description: |
    Cloudflare Worker endpoint that orchestrates Workers AI planning and the Todoist MCP Streamable HTTP pipeline.
    The API follows Google Cloud API Design Guide conventions. `POST /plan` returns newline-delimited JSON
    (a versioned, flat event envelope) so clients can surface progress in near real time. All error responses
    use RFC 9457 Problem Details (`application/problem+json`).
  version: "2.0.0"
servers:
  - url: https://{workerHost}
    description: Deployed Worker hostname.
    variables:
      workerHost:
        default: cf-todoist-daily-agent.example.workers.dev
security:
  - BasicAuth: []
paths:
  /plan:
    options:
      summary: Preflight request
      description: Responds to browser preflight requests. Always returns 204 to signal the supported headers.
      responses:
        "204":
          description: CORS metadata returned with no body.
        "403":
          description: Origin not authorized by `FRONTEND_ORIGIN` (rejected in `src/proxy.ts`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      summary: Generate a daily plan and synchronize Todoist tasks
      description: |
        Accepts a narrative prompt plus optional scheduling, defaults, and limits, runs the two-pass Workers AI
        pipeline, and pushes each resulting task to the Todoist MCP Streamable HTTP server. The response body is
        `application/x-ndjson` where every line is one event of the stream contract (see `PlanEvent`). The first
        line is always a `stream.open` event announcing the protocol version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
      responses:
        "200":
          description: NDJSON stream of plan events.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/PlanEventStream'
        "400":
          description: Validation failure. `errors[]` lists the offending fields.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "401":
          description: |
            Missing or invalid HTTP Basic Auth credentials. Enforced by `src/proxy.ts`
            before the route handler runs.
          headers:
            WWW-Authenticate:
              description: Basic Auth challenge with the configured realm (`AUTH_REALM`).
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "403":
          description: Origin not authorized by `FRONTEND_ORIGIN`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "413":
          description: Request body exceeds the 64KB cap enforced before JSON parsing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "415":
          description: Request `Content-Type` is not `application/json`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/transcribe:
    options:
      summary: Preflight request
      description: Responds to browser preflight requests. Always returns 204 to signal the supported headers.
      responses:
        "204":
          description: CORS metadata returned with no body.
        "403":
          description: Origin not authorized by `FRONTEND_ORIGIN` (rejected in `src/proxy.ts`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      summary: Convert microphone audio into a planning prompt
      description: |
        Helper endpoint used by the front-end voice button. Accepts a base64 encoded WebM/Opus clip (≤ 60 seconds),
        forwards it to `@cf/openai/whisper-large-v3-turbo`, and returns the raw text transcription so the UI can
        auto-submit `/plan`. The success body is `application/json`; errors are `application/problem+json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhisperRequest'
      responses:
        "200":
          description: Successfully transcribed audio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
        "400":
          description: Invalid payload (missing audio or failing validation).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "401":
          description: |
            Missing or invalid HTTP Basic Auth credentials. Enforced by `src/proxy.ts`
            before the route handler runs.
          headers:
            WWW-Authenticate:
              description: Basic Auth challenge with the configured realm (`AUTH_REALM`).
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "403":
          description: Origin not authorized by `FRONTEND_ORIGIN`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "413":
          description: Audio payload is larger than the allowed 8MB limit (content-length pre-check or decoded-size check).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "415":
          description: Request `Content-Type` is not `application/json`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "500":
          description: Whisper model invocation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
  schemas:
    PlanRequest:
      type: object
      additionalProperties: false
      required:
        - input
      description: |
        Request fields grouped by intent. The Worker rejects bodies larger than 64KB before parsing and requires
        `Content-Type: application/json` (otherwise `415`). Every object is strict — unknown properties are rejected.
        The per-field bounds mirror the server-side Zod schema.
      properties:
        input:
          type: object
          additionalProperties: false
          required:
            - prompt
          properties:
            prompt:
              type: string
              minLength: 1
              maxLength: 8192
              description: Natural language description of what should be planned for the day.
            preferences:
              type: string
              minLength: 1
              maxLength: 2048
              description: Additional constraints, focus blocks, or other hints for the planner.
        scheduling:
          type: object
          additionalProperties: false
          description: Optional scheduling hints applied when the model generates due strings.
          properties:
            timezone:
              type: string
              minLength: 3
              maxLength: 64
              description: IANA timezone name.
            due:
              type: string
              minLength: 3
              maxLength: 256
              description: Natural language deadline (for example "today before 6pm").
        defaults:
          type: object
          additionalProperties: false
          description: Optional defaults applied to generated tasks unless the model overrides them.
          properties:
            priority:
              type: integer
              minimum: 1
              maximum: 4
              description: Default Todoist priority when the model does not supply one.
            labels:
              type: array
              maxItems: 5
              items:
                type: string
                minLength: 1
                maxLength: 64
              description: Default Todoist labels to apply to every generated task unless overridden.
        limits:
          type: object
          additionalProperties: false
          properties:
            maxTasks:
              type: integer
              minimum: 1
              maximum: 10
              default: 5
              description: Caps the number of actionable tasks generated by Workers AI.
    PlanEventStream:
      description: |
        The Worker returns newline-delimited JSON. Each line is one `PlanEvent`. Every event carries a monotonic
        `seq` (the leading `stream.open` is `seq: 0`) and an ISO-8601 `ts`. Clients must parse until the stream ends
        and must tolerate unknown event types (in particular `debug.*` lines, which appear only when
        `DEBUG_EVENTS=true` and are NOT part of the stable contract).
      type: array
      items:
        $ref: '#/components/schemas/PlanEvent'
    PlanEvent:
      oneOf:
        - type: object
          required: [type, protocol, seq, ts]
          description: First line of the stream. Announces the contract version and echoes normalized request params.
          properties:
            type:
              const: stream.open
            protocol:
              type: string
              description: Stream contract version (for example `1.0`).
            seq:
              type: integer
              description: Always 0.
            ts:
              type: string
              format: date-time
            request:
              type: object
              description: Echo of normalized request parameters. Contains no sensitive fields.
              properties:
                maxTasks:
                  type: integer
        - type: object
          required: [type, seq, ts, stage, message]
          properties:
            type:
              const: plan.status
            seq:
              type: integer
            ts:
              type: string
              format: date-time
            stage:
              type: string
              enum: [ai.init, intent.detect, intent.classified]
              description: Closed set of progress stages.
            message:
              type: string
        - type: object
          required: [type, seq, ts, tasks]
          properties:
            type:
              const: plan.draft
            seq:
              type: integer
            ts:
              type: string
              format: date-time
            summary:
              type: string
            intent:
              type: string
              description: Scenario detected by the intent classifier (for example `single_reminder`).
            tasks:
              type: array
              items:
                $ref: '#/components/schemas/NormalizedTask'
        - type: object
          required: [type, seq, ts, status, task]
          properties:
            type:
              const: todoist.task
            seq:
              type: integer
            ts:
              type: string
              format: date-time
            status:
              type: string
              enum: [pending, created, failed]
            task:
              $ref: '#/components/schemas/NormalizedTask'
            todoistId:
              type: string
            code:
              type: string
              description: Stable failure code when `status` is `failed` (for example `todoist_sync_failed`).
            detail:
              type: string
              description: Raw failure detail. Present only when `DEBUG_EVENTS=true`.
        - type: object
          required: [type, seq, ts, created, failed, tasks, elapsedMs]
          properties:
            type:
              const: plan.final
            seq:
              type: integer
            ts:
              type: string
              format: date-time
            created:
              type: integer
            failed:
              type: integer
            tasks:
              type: array
              items:
                $ref: '#/components/schemas/TodoistTaskResult'
            elapsedMs:
              type: integer
        - type: object
          required: [type, seq, ts, code, message]
          properties:
            type:
              const: plan.error
            seq:
              type: integer
            ts:
              type: string
              format: date-time
            code:
              type: string
              description: |
                Stable error code from the `Problem.code` taxonomy. Terminal `/plan`
                failures currently emit `ai_unavailable` (planning model failed),
                `todoist_unavailable` (MCP connection failed), or `internal`.
            message:
              type: string
            detail:
              type: string
              description: Present only when `DEBUG_EVENTS=true`, so the production stream stays opaque.
        - type: object
          required: [type, seq, ts]
          additionalProperties: true
          description: |
            Internal observability event emitted only when the worker is started with `DEBUG_EVENTS=true`.
            Concrete variants include `debug.tools`, `debug.metadata`, `debug.inference`, and `debug.error`.
            The payload shape is intentionally open and is NOT part of the stable contract; production
            clients must ignore unknown event types instead of relying on these.
          properties:
            type:
              type: string
              pattern: '^debug\.'
            seq:
              type: integer
            ts:
              type: string
              format: date-time
    WhisperRequest:
      type: object
      required:
        - audio
      additionalProperties: false
      properties:
        audio:
          type: string
          description: Base64 encoded audio data (WebM/Opus recommended, ≤ 8MB decoded).
        language:
          type: string
          description: Optional hint for the language contained in the audio clip.
        task:
          type: string
          enum: [transcribe, translate]
          description: Defaults to `transcribe`.
    TranscriptionResponse:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: Transcribed text returned by Whisper.
        language:
          type: string
          description: Language code detected by the model, when available.
    NormalizedTask:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 4
          description: |
            Todoist REST priority. `4` is the highest urgency (UI label P1) and `1`
            is the lowest (UI label P4).
        labels:
          type: array
          items:
            type: string
        projectId:
          type: string
          description: Todoist project ID that the task should be created in.
        projectName:
          type: string
          description: Human-readable project name aligned with `projectId`.
        due:
          type: object
          properties:
            string:
              type: string
            date:
              type: string
              pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
            datetime:
              type: string
              format: date-time
    TodoistTaskResult:
      type: object
      required:
        - planned
        - status
      properties:
        planned:
          $ref: '#/components/schemas/NormalizedTask'
        status:
          type: string
          enum: [created, failed]
        todoistId:
          type: string
        code:
          type: string
          description: Stable failure code when `status` is `failed` (for example `todoist_sync_failed`).
        error:
          type: string
          description: Raw failure detail. Present only when `DEBUG_EVENTS=true`.
    Problem:
      type: object
      description: |
        RFC 9457 Problem Details. All error responses use media type `application/problem+json`.
        `code` is the stable, machine-readable discriminator clients should branch on; it mirrors the
        `plan.error.code` / `todoist.task.code` values in the stream.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          description: URI reference identifying the problem type (for example `/errors/validation_failed`).
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - validation_failed
            - unsupported_media_type
            - unauthorized
            - forbidden_origin
            - payload_too_large
            - rate_limited
            - misconfigured
            - ai_unavailable
            - todoist_unavailable
            - todoist_sync_failed
            - transcription_failed
            - internal
        detail:
          type: string
        errors:
          type: array
          description: Present for `validation_failed`; one entry per invalid field.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: Dotted path to the offending field (for example `input.prompt`).
              message:
                type: string
