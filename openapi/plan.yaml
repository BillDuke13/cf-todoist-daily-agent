openapi: 3.1.0
info:
  title: Todoist Daily Agent API
  description: |
    Cloudflare Worker endpoints for Workers AI task planning, Todoist MCP synchronization, and voice transcription.
    `POST /plan` returns newline-delimited JSON (`application/x-ndjson`) with a versioned flat event envelope.
    All HTTP error responses use RFC 9457 Problem Details (`application/problem+json`).
  version: "2.0.0"
servers:
  - url: https://{workerHost}
    description: Deployed Worker hostname.
    variables:
      workerHost:
        default: cf-todoist-daily-agent.example.workers.dev
security:
  - BasicAuth: []
paths:
  /plan:
    options:
      summary: Preflight request
      description: Responds to browser CORS preflight requests with supported methods and headers.
      responses:
        "204":
          description: CORS headers returned with no body.
        "403":
          description: Origin not authorized by `FRONTEND_ORIGIN`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      summary: Generate a daily plan and synchronize Todoist tasks
      description: |
        Accepts a prompt plus optional scheduling, defaults, and limits, runs the two-pass Workers AI
        pipeline, and pushes each resulting task to the Todoist MCP Streamable HTTP server. The response body is
        `application/x-ndjson` where each line is a `PlanEvent`, starting with `stream.open`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
      responses:
        "200":
          description: NDJSON stream of plan events.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/PlanEventStream'
        "400":
          description: Validation failure. `errors[]` lists the invalid fields.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "401":
          description: Missing or invalid HTTP Basic Auth credentials.
          headers:
            WWW-Authenticate:
              description: Basic Auth challenge with the configured `AUTH_REALM`.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "403":
          description: Origin not authorized by `FRONTEND_ORIGIN`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "413":
          description: Request body exceeds the 64 KB limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "415":
          description: Request `Content-Type` is not `application/json`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/transcribe:
    options:
      summary: Preflight request
      description: Responds to browser CORS preflight requests with supported methods and headers.
      responses:
        "204":
          description: CORS headers returned with no body.
        "403":
          description: Origin not authorized by `FRONTEND_ORIGIN`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      summary: Transcribe microphone audio into text
      description: |
        Accepts a base64-encoded WebM/Opus clip (up to 8 MB decoded), forwards it to
        `@cf/openai/whisper-large-v3-turbo`, and returns the transcribed text as JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhisperRequest'
      responses:
        "200":
          description: Successfully transcribed audio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
        "400":
          description: Invalid payload.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "401":
          description: Missing or invalid HTTP Basic Auth credentials.
          headers:
            WWW-Authenticate:
              description: Basic Auth challenge with the configured `AUTH_REALM`.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "403":
          description: Origin not authorized by `FRONTEND_ORIGIN`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "413":
          description: Audio payload exceeds the 8 MB limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "415":
          description: Request `Content-Type` is not `application/json`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "500":
          description: Whisper model invocation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
  schemas:
    PlanRequest:
      type: object
      additionalProperties: false
      required:
        - input
      description: |
        Grouped request payload. Unknown keys are rejected at all levels. Bodies over 64 KB
        return `413` and non-JSON `Content-Type` values return `415`.
      properties:
        input:
          type: object
          additionalProperties: false
          required:
            - prompt
          properties:
            prompt:
              type: string
              minLength: 1
              maxLength: 8192
              description: Natural-language description of what to plan.
            preferences:
              type: string
              minLength: 1
              maxLength: 2048
              description: Additional constraints or focus preferences.
        scheduling:
          type: object
          additionalProperties: false
          description: Optional scheduling hints for due dates.
          properties:
            timezone:
              type: string
              minLength: 3
              maxLength: 64
              description: IANA timezone name.
            due:
              type: string
              minLength: 3
              maxLength: 256
              description: Natural-language deadline (for example "today before 6pm").
        defaults:
          type: object
          additionalProperties: false
          description: Fallback task metadata applied when the model does not override it.
          properties:
            priority:
              type: integer
              minimum: 1
              maximum: 4
              description: Default Todoist REST priority (4 = P1, 1 = P4).
            labels:
              type: array
              maxItems: 5
              items:
                type: string
                minLength: 1
                maxLength: 64
              description: Default Todoist labels.
        limits:
          type: object
          additionalProperties: false
          properties:
            maxTasks:
              type: integer
              minimum: 1
              maximum: 10
              default: 5
              description: Maximum number of generated tasks.
    PlanEventStream:
      description: |
        Newline-delimited JSON stream of `PlanEvent` objects. Each event has a monotonic `seq`
        (starting at 0 for `stream.open`) and an ISO-8601 `ts`. Clients must ignore unknown
        event types such as `DEBUG_EVENTS`-gated `debug.*` frames.
      type: array
      items:
        $ref: '#/components/schemas/PlanEvent'
    PlanEvent:
      oneOf:
        - type: object
          required: [type, protocol, seq, ts]
          description: Leading frame announcing protocol version and normalized request limits.
          properties:
            type:
              const: stream.open
            protocol:
              type: string
              description: Stream protocol version (currently `1.0`).
            seq:
              type: integer
              description: Always 0.
            ts:
              type: string
              format: date-time
            request:
              type: object
              properties:
                maxTasks:
                  type: integer
        - type: object
          required: [type, seq, ts, stage, message]
          properties:
            type:
              const: plan.status
            seq:
              type: integer
            ts:
              type: string
              format: date-time
            stage:
              type: string
              enum: [ai.init, intent.detect, intent.classified]
            message:
              type: string
        - type: object
          required: [type, seq, ts, tasks]
          properties:
            type:
              const: plan.draft
            seq:
              type: integer
            ts:
              type: string
              format: date-time
            summary:
              type: string
            intent:
              type: string
              description: Detected intent scenario (for example `single_reminder`).
            tasks:
              type: array
              items:
                $ref: '#/components/schemas/NormalizedTask'
        - type: object
          required: [type, seq, ts, status, task]
          properties:
            type:
              const: todoist.task
            seq:
              type: integer
            ts:
              type: string
              format: date-time
            status:
              type: string
              enum: [pending, created, failed]
            task:
              $ref: '#/components/schemas/NormalizedTask'
            todoistId:
              type: string
            code:
              type: string
              description: Stable failure code when `status` is `failed`.
            detail:
              type: string
              description: Raw failure detail, present only when `DEBUG_EVENTS=true`.
        - type: object
          required: [type, seq, ts, created, failed, tasks, elapsedMs]
          properties:
            type:
              const: plan.final
            seq:
              type: integer
            ts:
              type: string
              format: date-time
            created:
              type: integer
            failed:
              type: integer
            tasks:
              type: array
              items:
                $ref: '#/components/schemas/TodoistTaskResult'
            elapsedMs:
              type: integer
        - type: object
          required: [type, seq, ts, code, message]
          properties:
            type:
              const: plan.error
            seq:
              type: integer
            ts:
              type: string
              format: date-time
            code:
              type: string
              description: Stable error code from `Problem.code` (`ai_unavailable`, `todoist_unavailable`, or `internal`).
            message:
              type: string
            detail:
              type: string
              description: Present only when `DEBUG_EVENTS=true`.
        - type: object
          required: [type, seq, ts]
          additionalProperties: true
          description: |
            Internal observability event emitted only when `DEBUG_EVENTS=true`
            (`debug.tools`, `debug.metadata`, `debug.inference`, `debug.error`).
            Not part of the stable contract.
          properties:
            type:
              type: string
              pattern: '^debug\.'
            seq:
              type: integer
            ts:
              type: string
              format: date-time
    WhisperRequest:
      type: object
      required:
        - audio
      additionalProperties: false
      properties:
        audio:
          type: string
          description: Base64-encoded audio payload (WebM/Opus recommended, up to 8 MB decoded).
        language:
          type: string
          description: Optional language hint.
        task:
          type: string
          enum: [transcribe, translate]
          description: Defaults to `transcribe`.
    TranscriptionResponse:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: Transcribed text returned by Whisper.
        language:
          type: string
          description: Detected language code, when available.
    NormalizedTask:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 4
          description: Todoist REST priority (4 = P1 highest, 1 = P4 lowest).
        labels:
          type: array
          items:
            type: string
        projectId:
          type: string
          description: Todoist project ID.
        projectName:
          type: string
          description: Human-readable project name matching `projectId`.
        due:
          type: object
          properties:
            string:
              type: string
            date:
              type: string
              pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
            datetime:
              type: string
              format: date-time
    TodoistTaskResult:
      type: object
      required:
        - planned
        - status
      properties:
        planned:
          $ref: '#/components/schemas/NormalizedTask'
        status:
          type: string
          enum: [created, failed]
        todoistId:
          type: string
        code:
          type: string
          description: Stable failure code when `status` is `failed`.
        error:
          type: string
          description: Raw failure detail, present only when `DEBUG_EVENTS=true`.
    Problem:
      type: object
      description: RFC 9457 Problem Details (`application/problem+json`).
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          description: Relative problem type URI (for example `/errors/validation_failed`).
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - validation_failed
            - unsupported_media_type
            - unauthorized
            - forbidden_origin
            - payload_too_large
            - rate_limited
            - misconfigured
            - ai_unavailable
            - todoist_unavailable
            - todoist_sync_failed
            - transcription_failed
            - internal
        detail:
          type: string
        errors:
          type: array
          description: Field-level validation errors for `validation_failed`.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: Dotted field path (for example `input.prompt`).
              message:
                type: string
